<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UCSUR · Quiz IA 50 preguntas</title><style>*{box-sizing:border-box}body{margin:0;background:#091631;color:#fff;font-family:Arial,system-ui}header{padding:20px 32px;background:#102b53;display:flex;justify-content:space-between;font-size:20px;font-weight:bold}main{max-width:1300px;margin:auto;padding:24px}.block{text-align:center;color:#ffdc6b;font-size:24px;font-weight:800}h1{font-size:clamp(32px,4.2vw,62px);text-align:center;min-height:140px}.answers{display:grid;grid-template-columns:1fr 1fr;gap:18px}.answer{min-height:145px;border:3px solid #fff5;border-radius:16px;color:#fff;font-size:clamp(24px,2.5vw,38px);font-weight:800;padding:24px;text-align:left}.answer:nth-child(1){background:#c02d50}.answer:nth-child(2){background:#1976cb}.answer:nth-child(3){background:#b57900}.answer:nth-child(4){background:#128357}.correct{outline:7px solid #ffe96e}.wrong{opacity:.32}.controls{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;margin:30px}button{cursor:pointer}.ctrl{background:white;color:#112b4e;border:0;border-radius:10px;padding:16px 25px;font-size:23px;font-weight:800}#feedback{text-align:center;font-size:26px;color:#ffe58b;min-height:35px}@media(max-width:650px){.answers{grid-template-columns:1fr}.answer{min-height:85px}h1{min-height:0}}</style></head><body><header><span>UCSUR · FUNDAMENTOS DE IA Y PROGRAMACIÓN</span><span id="count"></span></header><main><p class="block" id="block"></p><h1 id="question"></h1><div class="answers" id="answers"></div><p id="feedback"></p><div class="controls"><button class="ctrl" onclick="move(-1)">◀ Anterior</button><button class="ctrl" onclick="show()">✓ Mostrar respuesta</button><button class="ctrl" onclick="move(1)">Siguiente ▶</button></div></main><script>const questions=[{"question":"¿Qué permite Machine Learning?","choices":["Aprender patrones a partir de datos","Porque aprende con respuestas conocidas","Horas de estudio","Nota final"],"correct":0,"block":1},{"question":"¿Por qué se llama aprendizaje supervisado?","choices":["Entradas y respuestas conocidas","Porque aprende con respuestas conocidas","Nota final","Números frente a categorías"],"correct":1,"block":1},{"question":"Al predecir notas según horas de estudio, ¿cuál es X?","choices":["Para predecir nuevos casos","La variable objetivo","Horas de estudio","Entradas y respuestas conocidas"],"correct":2,"block":1},{"question":"¿Cuál es la variable y en ese ejemplo?","choices":["La variable objetivo","La relación entre ambas variables","Una matriz de confusión","Nota final"],"correct":3,"block":1},{"question":"¿Qué diferencia regresión de clasificación?","choices":["Números frente a categorías","Aprender patrones a partir de datos","Porque aprende con respuestas conocidas","Horas de estudio"],"correct":0,"block":1},{"question":"¿Qué necesita un modelo supervisado?","choices":["Números frente a categorías","Entradas y respuestas conocidas","Horas de estudio","Nota final"],"correct":1,"block":1},{"question":"¿Para qué se aprenden patrones históricos?","choices":["Entradas y respuestas conocidas","La variable objetivo","Para predecir nuevos casos","Números frente a categorías"],"correct":2,"block":1},{"question":"¿Qué representa y?","choices":["Para predecir nuevos casos","La relación entre ambas variables","Una matriz de confusión","La variable objetivo"],"correct":3,"block":1},{"question":"¿Qué aprende un modelo de horas y notas?","choices":["La relación entre ambas variables","Aprender patrones a partir de datos","Porque aprende con respuestas conocidas","Horas de estudio"],"correct":0,"block":1},{"question":"¿Por qué regresión lineal SIMPLE?","choices":["El intercepto","Usa una sola variable de entrada","La pendiente","14"],"correct":1,"block":2},{"question":"¿Qué representa un punto del gráfico horas-notas?","choices":["Una recta","10","Un caso observado","El intercepto"],"correct":2,"block":2},{"question":"Si la recta sube, ¿qué tendencia existe?","choices":["10","Regresión","Una matriz de confusión","Positiva"],"correct":3,"block":2},{"question":"En y=mx+b, ¿qué representa m?","choices":["La pendiente","Usa una sola variable de entrada","Un caso observado","Positiva"],"correct":0,"block":2},{"question":"Si y=2x+4 y x=5, ¿cuánto es y?","choices":["El intercepto","14","Positiva","La pendiente"],"correct":1,"block":2},{"question":"En y=mx+b, ¿qué representa b?","choices":["Una recta","10","El intercepto","14"],"correct":2,"block":2},{"question":"¿Qué forma ajusta la regresión lineal simple?","choices":["10","Regresión","Una matriz de confusión","Una recta"],"correct":3,"block":2},{"question":"Si y=2x+4 y x=3, ¿cuánto es y?","choices":["10","Usa una sola variable de entrada","Un caso observado","Positiva"],"correct":0,"block":2},{"question":"¿Predecir temperatura en grados es…?","choices":["14","Regresión","Positiva","La pendiente"],"correct":1,"block":2},{"question":"¿Qué resultado produce un clasificador?","choices":["Son códigos de categorías","Probabilidades de clases","Una categoría","Bajo, medio o alto"],"correct":2,"block":3},{"question":"¿Cuál es un ejemplo binario?","choices":["Probabilidades de clases","No aprueba","Dos","Aprueba o desaprueba"],"correct":3,"block":3},{"question":"¿Cuál es un ejemplo multiclase?","choices":["Bajo, medio o alto","Dos","Aprueba","Una matriz de confusión"],"correct":0,"block":3},{"question":"¿Qué significa codificar Bajo=0, Medio=1, Alto=2?","choices":["Bajo, medio o alto","Son códigos de categorías","Una categoría","Aprueba o desaprueba"],"correct":1,"block":3},{"question":"La regresión logística estima…","choices":["Son códigos de categorías","No aprueba","Probabilidades de clases","Bajo, medio o alto"],"correct":2,"block":3},{"question":"35 % de aprobar y umbral 50 %: ¿qué predice?","choices":["Probabilidades de clases","Dos","Aprueba","No aprueba"],"correct":3,"block":3},{"question":"¿Cuántas clases hay en clasificación binaria?","choices":["Dos","Aprueba","Una matriz de confusión","Un número de identificación"],"correct":0,"block":3},{"question":"En un clasificador de aprobación, ¿cuál es y?","choices":["Probabilidades de clases","Aprueba o desaprueba","Bajo, medio o alto","Son códigos de categorías"],"correct":1,"block":3},{"question":"82 % de aprobar y umbral 50 %: ¿qué predice?","choices":["Probabilidades de clases","No aprueba","Aprueba","Son códigos de categorías"],"correct":2,"block":3},{"question":"¿Una probabilidad de 82 % es una certeza?","choices":["Peor que predecir con el promedio","85 %","Una matriz de confusión","No, es una estimación"],"correct":3,"block":3},{"question":"¿Para qué separar entrenamiento y prueba?","choices":["Evaluar con datos no usados al entrenar","No, es una estimación","20","Error absoluto promedio de 1.25"],"correct":0,"block":4},{"question":"En una división 80/20 de 100 datos, ¿cuántos van a prueba?","choices":["Menor error cuadrático medio","20","Error absoluto promedio de 1.25","4"],"correct":1,"block":4},{"question":"¿Qué indica MAE de 1.25 puntos?","choices":["Explica el 80 % de la variación","Peor que predecir con el promedio","Error absoluto promedio de 1.25","Menor error cuadrático medio"],"correct":2,"block":4},{"question":"Errores 2, 2 y 2: ¿cuál es MSE?","choices":["Peor que predecir con el promedio","85 %","Una matriz de confusión","4"],"correct":3,"block":4},{"question":"¿Qué indica un MSE menor?","choices":["Menor error cuadrático medio","No, es una estimación","Evaluar con datos no usados al entrenar","20"],"correct":0,"block":4},{"question":"¿Qué significa R²=0.80?","choices":["4","Explica el 80 % de la variación","20","Error absoluto promedio de 1.25"],"correct":1,"block":4},{"question":"¿Qué indica R² negativo?","choices":["Menor error cuadrático medio","Explica el 80 % de la variación","Peor que predecir con el promedio","4"],"correct":2,"block":4},{"question":"12 VP y 5 VN de 20 casos: ¿Accuracy?","choices":["Explica el 80 % de la variación","Peor que predecir con el promedio","Una matriz de confusión","85 %"],"correct":3,"block":4},{"question":"Predijo «Aprueba» pero desaprobó: ¿qué es?","choices":["Falso positivo","Aciertos y tipos de errores","80","No, es una opción frecuente"],"correct":0,"block":4},{"question":"¿Qué permite ver una matriz de confusión?","choices":["3","Aciertos y tipos de errores","No, es una opción frecuente","Falso negativo"],"correct":1,"block":4},{"question":"80/20 de 100 datos: ¿cuántos entrenan?","choices":["15 %","Accuracy","80","3"],"correct":2,"block":4},{"question":"¿La división 80/20 es obligatoria?","choices":["Accuracy","Regresión","Una matriz de confusión","No, es una opción frecuente"],"correct":3,"block":4},{"question":"Realmente aprobó, pero predijo «Desaprueba»: ¿qué es?","choices":["Falso negativo","Falso positivo","Aciertos y tipos de errores","80"],"correct":0,"block":4},{"question":"12 VP y 5 VN de 20 casos: ¿cuántos errores?","choices":["Falso negativo","3","80","No, es una opción frecuente"],"correct":1,"block":4},{"question":"Accuracy 85 %: ¿qué porcentaje de errores?","choices":["3","Accuracy","15 %","Falso negativo"],"correct":2,"block":4},{"question":"¿Cuál es una métrica de clasificación?","choices":["15 %","Regresión","Una matriz de confusión","Accuracy"],"correct":3,"block":4},{"question":"Para predecir precio de un producto usamos…","choices":["Regresión","Falso positivo","Aciertos y tipos de errores","80"],"correct":0,"block":5},{"question":"Para predecir riesgo Bajo/Medio/Alto usamos…","choices":["Datos sesgados","Clasificación multiclase","Pueden ser una o varias características","No, requiere revisión humana"],"correct":1,"block":5},{"question":"¿Qué es correcto sobre las variables X?","choices":["Una matriz de confusión","Un número de identificación","Pueden ser una o varias características","Datos sesgados"],"correct":2,"block":5},{"question":"¿Se debe negar matrícula solo por una predicción?","choices":["Pueden ser una o varias características","Datos sesgados","Una matriz de confusión","No, requiere revisión humana"],"correct":3,"block":5},{"question":"Si Bajo=0, Medio=1 y Alto=2, ¿qué modelo corresponde?","choices":["Clasificación multiclase","Pueden ser una o varias características","No, requiere revisión humana","Datos sesgados"],"correct":0,"block":5},{"question":"¿Qué puede perjudicar a ciertos grupos?","choices":["Un número de identificación","Datos sesgados","No, requiere revisión humana","Una matriz de confusión"],"correct":1,"block":5}];const blocks=['','Datos y aprendizaje supervisado','Regresión lineal simple','Clasificación','Entrenamiento y evaluación','Comparación de modelos'];let n=0,revealed=false;function draw(){let q=questions[n];document.getElementById('count').textContent=(n+1)+' / 50';document.getElementById('block').textContent='BLOQUE '+q.block+' · '+blocks[q.block];document.getElementById('question').textContent=q.question;document.getElementById('answers').innerHTML=q.choices.map((a,i)=>'<button class="answer '+(revealed?(i===q.correct?'correct':'wrong'):'')+'">'+String.fromCharCode(65+i)+'. '+a+'</button>').join('');document.getElementById('feedback').textContent=revealed?'Respuesta correcta: '+q.choices[q.correct]:''}function move(d){n=Math.max(0,Math.min(49,n+d));revealed=false;draw()}function show(){revealed=true;draw()}document.onkeydown=e=>{if(e.key==='ArrowRight')move(1);if(e.key==='ArrowLeft')move(-1);if(e.key===' '){e.preventDefault();show()}};draw();</script></body></html>

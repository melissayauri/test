<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UCSUR · Kahoot teórico</title><style>*{box-sizing:border-box}body{margin:0;background:#071731;color:#fff;font-family:system-ui,Arial}header{background:#102c55;padding:18px 25px;font-weight:900;display:flex;justify-content:space-between}main{max-width:1200px;margin:auto;padding:22px;text-align:center}h1{font-size:clamp(30px,4vw,58px);margin:24px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.opt{min-height:130px;border:3px solid #ffffff55;border-radius:16px;color:#fff;padding:20px;font-size:clamp(20px,2.6vw,35px);font-weight:900;text-align:left;cursor:pointer}.opt:nth-child(1){background:#c22e4d}.opt:nth-child(2){background:#147bd5}.opt:nth-child(3){background:#c18a00}.opt:nth-child(4){background:#128d69}.opt:disabled{opacity:.55}.btn{background:#ffdd65;color:#0c2142;border:0;border-radius:12px;font-size:23px;font-weight:900;padding:14px 25px;margin:10px;cursor:pointer}input{font-size:25px;padding:14px;border-radius:10px;max-width:95%;border:0;margin:10px}.muted{color:#cad9ef}.panel{background:#12335d;border-radius:18px;padding:24px;margin:15px auto;max-width:760px}.score{display:flex;justify-content:space-between;padding:10px;border-bottom:1px solid #ffffff44;font-size:22px}.big{font-size:clamp(45px,8vw,100px);font-weight:900;color:#ffe27d}.hide{display:none}.timer{font-size:34px;font-weight:900;color:#ffdc65}@media(max-width:650px){.grid{grid-template-columns:1fr}.opt{min-height:80px;font-size:22px}}</style></head><body><header><span>UCSUR · FUNDAMENTOS DE IA</span><span id="top"></span></header><main id="app"></main><script>const BASE=location.origin;async function api(path,data){let r=await fetch('/api/'+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});let j=await r.json();if(!r.ok)throw Error(j.error||'Error');return j}async function state(id){return await(await fetch('/api/state'+(id?'?id='+encodeURIComponent(id):''),{cache:'no-store'})).json()}function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function rank(list){return '<div class="panel"><h2>🏆 Clasificación</h2>'+list.map((p,i)=>'<div class="score"><span>'+(i+1)+'. '+escapeHtml(p.name)+'</span><b>'+p.score+' pts</b></div>').join('')+'</div>'}</script><script>let key=sessionStorage.getItem('teacherKey')||'',last='';async function action(a){try{await api(a,{key});last='';refresh()}catch(e){alert(e.message)}}function login(){key=document.getElementById('key').value;sessionStorage.setItem('teacherKey',key);last='';refresh()}async function refresh(){try{const s=await state();document.getElementById('top').textContent=s.index+1+' / '+s.total;if(!key){if(last!=='login'){document.getElementById('app').innerHTML='<h1>Panel docente</h1><div class="panel"><input id="key" type="password" placeholder="Clave docente" autocomplete="off"><button class="btn" onclick="login()">Ingresar</button></div>';last='login'}return}let phase=s.phase+'-'+s.index+'-'+s.round+'-'+s.players.length;if(phase!==last){last=phase;let h='<p class="muted">Panel docente · 50 preguntas</p>';if(s.phase==='lobby')h+='<h1>Escanea y participa</h1><div class="panel"><p>PIN de ingreso</p><div class="big">'+s.pin+'</div><img style="background:white;padding:12px;border-radius:12px;width:min(340px,80vw)" src="https://api.qrserver.com/v1/create-qr-code/?size=400x400&data='+encodeURIComponent(location.origin+'/alumno')+'"><p>'+location.origin+'/alumno</p><h2>Jugadores: '+s.players.length+'</h2><p>'+s.players.map(p=>escapeHtml(p.name)).join(' · ')+'</p><button class="btn" onclick="action(\'start\')">▶ Iniciar juego</button></div>';if(s.phase==='question')h+='<p>'+escapeHtml(s.block)+'</p><h1>'+escapeHtml(s.question)+'</h1><div class="timer" id="clock"></div><div class="grid">'+s.choices.map((x,i)=>'<div class="opt">'+String.fromCharCode(65+i)+'. '+escapeHtml(x)+'</div>').join('')+'</div><p class="muted">Respuestas recibidas: '+Object.keys(s.players).length+' participantes (consulta en tiempo real)</p><button class="btn" onclick="action(\'reveal\')">Mostrar resultados</button>';if(s.phase==='results')h+='<h1>Resultados · Pregunta '+(s.index+1)+'</h1><div class="grid">'+s.choices.map((x,i)=>'<div class="opt" style="'+(i===s.correct?'outline:7px solid #ffe66b':'opacity:.55')+'">'+String.fromCharCode(65+i)+'. '+escapeHtml(x)+'<br>Votos: '+s.counts[i]+'</div>').join('')+'</div>'+rank(s.leaderboard)+'<button class="btn" onclick="action(\'next\')">'+(s.index===49?'🏁 Finalizar':'Siguiente pregunta ▶')+'</button>';if(s.phase==='finished')h='<h1>🏆 ¡Juego finalizado!</h1>'+rank(s.leaderboard);h+='<div><button class="btn" onclick="if(confirm(\'¿Reiniciar toda la partida?\'))action(\'reset\')">Reiniciar partida</button></div>';document.getElementById('app').innerHTML=h}if(s.phase==='question'&&document.getElementById('clock'))document.getElementById('clock').textContent=Math.max(0,Math.ceil((s.deadline-Date.now())/1000))+' s'}catch(e){}}setInterval(refresh,900);refresh();</script></body></html>

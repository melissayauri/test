<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UCSUR · Kahoot teórico</title><style>*{box-sizing:border-box}body{margin:0;background:#071731;color:#fff;font-family:system-ui,Arial}header{background:#102c55;padding:18px 25px;font-weight:900;display:flex;justify-content:space-between}main{max-width:1200px;margin:auto;padding:22px;text-align:center}h1{font-size:clamp(30px,4vw,58px);margin:24px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.opt{min-height:130px;border:3px solid #ffffff55;border-radius:16px;color:#fff;padding:20px;font-size:clamp(20px,2.6vw,35px);font-weight:900;text-align:left;cursor:pointer}.opt:nth-child(1){background:#c22e4d}.opt:nth-child(2){background:#147bd5}.opt:nth-child(3){background:#c18a00}.opt:nth-child(4){background:#128d69}.opt:disabled{opacity:.55}.btn{background:#ffdd65;color:#0c2142;border:0;border-radius:12px;font-size:23px;font-weight:900;padding:14px 25px;margin:10px;cursor:pointer}input{font-size:25px;padding:14px;border-radius:10px;max-width:95%;border:0;margin:10px}.muted{color:#cad9ef}.panel{background:#12335d;border-radius:18px;padding:24px;margin:15px auto;max-width:760px}.score{display:flex;justify-content:space-between;padding:10px;border-bottom:1px solid #ffffff44;font-size:22px}.big{font-size:clamp(45px,8vw,100px);font-weight:900;color:#ffe27d}.hide{display:none}.timer{font-size:34px;font-weight:900;color:#ffdc65}@media(max-width:650px){.grid{grid-template-columns:1fr}.opt{min-height:80px;font-size:22px}}</style></head><body><header><span>UCSUR · FUNDAMENTOS DE IA</span><span id="top"></span></header><div style="text-align:center;padding:8px"><button class="btn" id="musicToggle" onclick="toggleMusic()" style="font-size:17px;padding:9px 17px">🎵 Activar música</button></div><main id="app"></main><script>const BASE=location.origin;async function api(path,data){let r=await fetch('/api/'+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});let j=await r.json();if(!r.ok)throw Error(j.error||'Error');return j}async function state(id){return await(await fetch('/api/state'+(id?'?id='+encodeURIComponent(id):''),{cache:'no-store'})).json()}function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function rank(list){return '<div class="panel"><h2>🏆 Clasificación</h2>'+list.map((p,i)=>'<div class="score"><span>'+(i+1)+'. '+escapeHtml(p.name)+'</span><b>'+p.score+' pts</b></div>').join('')+'</div>'}</script><script>let id=localStorage.getItem('quizid')||'',busy=false,last='',joining=false;async function join(){if(joining)return;joining=true;try{let r=await api('join',{name:document.getElementById('name').value,pin:document.getElementById('pin').value});id=r.id;localStorage.setItem('quizid',id);last='';await refresh()}catch(e){alert(e.message)}finally{joining=false}}async function answer(i){try{await api('answer',{id,choice:i});last='';refresh()}catch(e){alert(e.message)}}async function refresh(){if(joining&&!id)return;const requestId=id;try{const s=await state(requestId);if(requestId!==id)return;document.getElementById('top').textContent=s.index+1+' / '+s.total;if(!s.me){if(requestId){id='';localStorage.removeItem('quizid')}if(last!=='join'){document.getElementById('app').innerHTML='<h1>🎮 ¡Únete al desafío!</h1><div class="panel"><p>Escanea el QR del proyector e ingresa tu alias</p><input id="name" placeholder="Tu alias" maxlength="24"><input id="pin" placeholder="PIN de 6 dígitos" inputmode="numeric"><br><button class="btn" onclick="join()">Ingresar a la partida</button></div>';last='join'}return}const phase=s.phase+'-'+s.index+'-'+s.round+'-'+s.me.answered;if(phase!==last){last=phase;let h='';if(s.phase==='lobby')h='<h1>¡Estás dentro, '+escapeHtml(s.me.name)+'!</h1><div class="panel"><h2>Espera a que tu docente inicie la partida</h2><p>Jugadores conectados: '+s.players.length+'</p></div>';if(s.phase==='section')h='<div class="panel"><p class="muted">SECCIÓN '+s.sectionNumber+' DE 5</p><h1>'+escapeHtml(s.block)+'</h1><h2>Preguntas '+s.sectionStart+' a '+s.sectionEnd+'</h2><p>Espera a que tu docente comience esta sección</p></div>';if(s.phase==='question')h='<p class="muted">'+escapeHtml(s.block)+'</p><h1>'+escapeHtml(s.question)+'</h1>'+(s.me.answered?'<h2>✓ Respuesta enviada. Espera los resultados.</h2>':'<div class="grid">'+s.choices.map((x,i)=>'<button class="opt" onclick="answer('+i+')">'+String.fromCharCode(65+i)+'. '+escapeHtml(x)+'</button>').join('')+'</div>');if(s.phase==='results')h='<p class="muted">Pregunta '+(s.index+1)+'</p><h1>'+escapeHtml(s.question)+'</h1><div class="panel"><h2>Respuesta correcta: '+escapeHtml(s.choices[s.correct])+'</h2><p style="font-size:22px;line-height:1.5">'+escapeHtml(s.explanation||'')+'</p><p class="big">+'+s.me.lastGain+' puntos</p><h2>Tu total: '+s.me.score+' puntos</h2></div>'+rank(s.leaderboard);if(s.phase==='finished')h='<h1>🏆 ¡Partida terminada!</h1>'+rank(s.leaderboard);document.getElementById('app').innerHTML=h}}catch(e){console.error('Error actualizando alumno',e)}}setInterval(refresh,1300);refresh();</script><script>let musicCtx=null,musicTimer=null,musicOn=false,musicStep=0;function note(freq,dur=.22){if(!musicCtx)return;let o=musicCtx.createOscillator(),g=musicCtx.createGain(),t=musicCtx.currentTime;o.type='sine';o.frequency.value=freq;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.035,t+.025);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(musicCtx.destination);o.start(t);o.stop(t+dur+.03)}function toggleMusic(){if(musicOn){clearInterval(musicTimer);musicTimer=null;musicOn=false}else{const C=window.AudioContext||window.webkitAudioContext;if(!C){alert('Tu navegador no admite audio');return}musicCtx=musicCtx||new C();musicCtx.resume();musicOn=true;const melody=[392,493.88,587.33,493.88,440,523.25,659.25,523.25,392,493.88,587.33,783.99,659.25,523.25,493.88,440];musicTimer=setInterval(()=>{note(melody[musicStep++%melody.length])},330)}const b=document.getElementById('musicToggle');if(b)b.textContent=musicOn?'🔇 Silenciar música':'🎵 Activar música'}</script></body></html>
